name: Build and Deploy Hugo site to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.155.2"
          extended: true

      - name: Inject StaticForms key into build content
        env:
          STATIC_FORMS_KEY: ${{ secrets.STATIC_FORMS_KEY }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ] && [ -z "${STATIC_FORMS_KEY}" ]; then
            echo "Missing required secret: STATIC_FORMS_KEY"
            exit 1
          fi

          static_key="${STATIC_FORMS_KEY:-ci-placeholder-staticforms-key}"
          escaped_static_key=$(printf '%s' "$static_key" | sed -e 's/[\/&]/\\&/g')
          sed -i "s|__STATIC_FORMS_KEY__|$escaped_static_key|g" content/pages/about.md

      - name: Build site
        run: hugo --minify --gc --panicOnWarning

      - name: Verify site output
        run: node scripts/verify-site.mjs public

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
